<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" role="img" aria-labelledby="title desc">
<title id="title">Aayan Wasti — Software developer</title>
<desc id="desc">A simple banner in soft peach, warm pink, and muted grey, with subtle cloud shapes matching a sunset sky.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0.1" x2="1" y2="0.9">
    <stop offset="0" stop-color="#E2DDE1"/>
    <stop offset=".55" stop-color="#F2D8D2"/>
    <stop offset="1" stop-color="#F5BCA9"/>
  </linearGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".04"/>
    <stop offset=".55" stop-color="#FFF8F6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#C6BCC5" stop-opacity=".52"/>
    <stop offset="1" stop-color="#E1ADB0" stop-opacity=".12"/>
  </linearGradient>
</defs>
<rect width="1280" height="280" rx="15" fill="url(#sky)"/>
