  <path d="M816 100c30-18 61-23 91-17 29 5 57 0 84-17 33-21 67-19 94-2 26 15 57 15 82 3 34-17 75-9 113 10v46c-40-13-76-8-115 5-47 14-79 6-109-10-29-16-67-10-105 10-51 25-95 16-135-5z" fill="url(#cloud)" opacity=".48"/>
</g>
<text x="81" y="79" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#635B65">HELLO, I'M</text>
<text x="78" y="155" font-family="Arial,Helvetica,sans-serif" font-size="69" font-weight="700" letter-spacing=".4" fill="#313744">Aayan Wasti</text>
<text x="82" y="204" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#55515C">I build software people can actually use.</text>
